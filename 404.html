<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>見つかりません</title>
<style>
  :root{--bg:#f6f4ef;--ink:#1d1c1a;--mu:#6b675f;--ac:#c2622d}
  @media (prefers-color-scheme:dark){:root{--bg:#141413;--ink:#ecebe6;--mu:#9c988f;--ac:#e08a55}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;text-align:center}
  h1{font-size:clamp(28px,6vw,40px);margin:0 0 8px}
  p{color:var(--mu);margin:0 0 24px}
  a{color:var(--ac);font-weight:700}
</style>
</head>
<body>
<main>
  <h1>ページが見つかりません</h1>
  <p>アドレスが変わったか、まだ公開されていない作品です。</p>
  <a href="/">一覧へ戻る</a>
</main>
</body>
</html>
